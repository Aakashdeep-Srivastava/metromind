<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87ECE8"/>
      <stop offset="100%" style="stop-color:#5FCFC9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- City buildings silhouette -->
  <g fill="#1F1F2E">
    <!-- Left building -->
    <rect x="80" y="220" width="70" height="200" rx="4"/>
    <rect x="90" y="240" width="15" height="20" rx="2" fill="#87ECE8"/>
    <rect x="115" y="240" width="15" height="20" rx="2" fill="#87ECE8"/>
    <rect x="90" y="280" width="15" height="20" rx="2" fill="#87ECE8"/>
    <rect x="115" y="280" width="15" height="20" rx="2" fill="#87ECE8"/>
    <rect x="90" y="320" width="15" height="20" rx="2" fill="#87ECE8"/>
    <rect x="115" y="320" width="15" height="20" rx="2" fill="#87ECE8"/>
    <!-- Center tall building -->
    <rect x="170" y="140" width="90" height="280" rx="4"/>
    <rect x="185" y="160" width="20" height="25" rx="2" fill="#87ECE8"/>
    <rect x="215" y="160" width="20" height="25" rx="2" fill="#87ECE8"/>
    <rect x="185" y="200" width="20" height="25" rx="2" fill="#87ECE8"/>
    <rect x="215" y="200" width="20" height="25" rx="2" fill="#87ECE8"/>
    <rect x="185" y="240" width="20" height="25" rx="2" fill="#87ECE8"/>
    <rect x="215" y="240" width="20" height="25" rx="2" fill="#87ECE8"/>
    <rect x="185" y="280" width="20" height="25" rx="2" fill="#87ECE8"/>
    <rect x="215" y="280" width="20" height="25" rx="2" fill="#87ECE8"/>
    <rect x="185" y="320" width="20" height="25" rx="2" fill="#87ECE8"/>
    <rect x="215" y="320" width="20" height="25" rx="2" fill="#87ECE8"/>
    <!-- Right building -->
    <rect x="280" y="180" width="80" height="240" rx="4"/>
    <rect x="295" y="200" width="18" height="22" rx="2" fill="#87ECE8"/>
    <rect x="323" y="200" width="18" height="22" rx="2" fill="#87ECE8"/>
    <rect x="295" y="240" width="18" height="22" rx="2" fill="#87ECE8"/>
    <rect x="323" y="240" width="18" height="22" rx="2" fill="#87ECE8"/>
    <rect x="295" y="280" width="18" height="22" rx="2" fill="#87ECE8"/>
    <rect x="323" y="280" width="18" height="22" rx="2" fill="#87ECE8"/>
    <rect x="295" y="320" width="18" height="22" rx="2" fill="#87ECE8"/>
    <rect x="323" y="320" width="18" height="22" rx="2" fill="#87ECE8"/>
    <!-- Far right small building -->
    <rect x="380" y="260" width="55" height="160" rx="4"/>
    <rect x="392" y="280" width="12" height="18" rx="2" fill="#87ECE8"/>
    <rect x="412" y="280" width="12" height="18" rx="2" fill="#87ECE8"/>
    <rect x="392" y="315" width="12" height="18" rx="2" fill="#87ECE8"/>
    <rect x="412" y="315" width="12" height="18" rx="2" fill="#87ECE8"/>
  </g>
  <!-- Pulse/brain wave at top -->
  <path d="M120 100 L180 100 L200 60 L220 130 L240 80 L260 110 L280 70 L300 120 L320 90 L340 100 L400 100" 
        stroke="#1F1F2E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
